[workspace]
resolver = "3"
# keyrelay is generated from the api-keys-ka-jugad skill and has its own lockfile; it is built and tested on its own.
exclude = ["tools/keyrelay"]
members = [
  "spec",
  "runtime/receipt",
  "runtime/py",
  "verifier",
  "verifier/wasm",
  "evidence/store",
  "evidence/validator",
  "chain/client",
  "chain/gateway",
]

[workspace.package]
edition = "2024"
license = "GPL-3.0-only"
version = "0.1.0"
rust-version = "1.98"

[workspace.dependencies]
mergit-spec = { path = "spec" }
mergit-receipt = { path = "runtime/receipt" }
mergit-verifier = { path = "verifier" }
mergit-chain-client = { path = "chain/client" }
alloy-primitives = { version = "1", features = ["serde", "k256"] }
alloy-sol-types = { version = "1", features = ["eip712-serde"] }
alloy-signer = "2"
alloy-signer-local = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.1"
globset = "0.4"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
base64 = "0.22"
thiserror = "2"
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "fs", "sync", "signal"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["cors", "limit", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
http-body-util = "0.1"
alloy = { version = "2", default-features = false, features = ["std", "contract", "provider-http", "reqwest", "reqwest-rustls-tls", "signer-local", "sol-types", "json-abi", "rpc-types"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "uuid", "chrono", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
wiremock = "0.6"
anyhow = "1"
rand = "0.9"
