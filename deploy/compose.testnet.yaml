# The Rust services against Base Sepolia, on one machine (a laptop now, one server later).
#   deploy/make-testnet-env.sh <alchemy-rpc-url>                    # once: writes deploy/secrets/testnet.env
#   docker compose -f deploy/compose.testnet.yaml up --build
# Needs ../mergit-contracts/deployments/base-sepolia.json (from script/testnet.sh deploy).
# Every secret comes from deploy/secrets/testnet.env, which is git-ignored. Nothing secret is in this file.
# The control plane (Python) is not in this file: it runs from its own repo and talks to the ports below.

x-rust: &rust
  build: { context: .., dockerfile: deploy/docker/rust.Dockerfile }
  image: mergit-rust:local
  restart: unless-stopped
  env_file: secrets/testnet.env
  extra_hosts: ["host.docker.internal:host-gateway"]
  volumes:
    - ../../mergit-contracts/deployments/base-sepolia.json:/deployments/base-sepolia.json:ro
  environment: &chain
    DEPLOYMENT_FILE: /deployments/base-sepolia.json
    RUST_LOG: info

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment: { POSTGRES_PASSWORD: mergit, POSTGRES_DB: mergit }
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "postgres"], interval: 2s, retries: 30 }

  store:
    <<: *rust
    command: ["mergit-store"]
    environment: { STORE_DATA_DIR: /data, STORE_ADDR: "0.0.0.0:8081" }
    volumes: ["receipts:/data"]
    ports: ["8081:8081"]

  validator:
    <<: *rust
    command: ["mergit-validator"]
    environment:
      <<: *chain
      STORE_URL: http://store:8081
      AUDIT_P: "1.0"
      VALIDATOR_DATA_DIR: /data
      VALIDATOR_ADDR: "0.0.0.0:8083"
    volumes:
      - audits:/data
      - ../../mergit-contracts/deployments/base-sepolia.json:/deployments/base-sepolia.json:ro
    ports: ["8083:8083"]

  gateway:
    <<: *rust
    command: ["mergit-gateway"]
    environment:
      <<: *chain
      DATABASE_URL: postgres://postgres:mergit@postgres:5432/mergit
      VALIDATOR_URL: http://validator:8083
      # The orchestration API; on the same machine it is published on the host at 8000.
      ORCHESTRATOR_URL: http://host.docker.internal:8000
      CONFIRMATIONS: "2"
      # Alchemy's free tier allows getLogs over at most 10 blocks. START_BLOCK (optional, in testnet.env) skips the
      # empty history before the first use; without it the gateway reads from the deployment's deploy block.
      # The gateway reads LOG_RANGE blocks every 2 seconds, so it keeps up only if that is more than the chain adds in
      # 2 seconds. Base Sepolia made 5 blocks a second on 2026-11-06 (10 per 2 s), which LOG_RANGE 10 only just matches:
      # it never caught up and ran about 19 hours behind, so funding showed up hours late. On a node that allows
      # larger ranges set LOG_RANGE in deploy/.env (the public https://sepolia.base.org allows 200; 150 leaves room).
      LOG_RANGE: "${LOG_RANGE:-10}"
      GATEWAY_ADDR: "0.0.0.0:8082"
    ports: ["8082:8082"]
    depends_on:
      postgres: { condition: service_healthy }

volumes: { pgdata: {}, receipts: {}, audits: {} }
