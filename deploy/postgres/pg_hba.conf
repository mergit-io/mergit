# Who may log in to cp_postgres (deploy/compose.controlplane.yaml). It replaces the image's default, whose last line,
# `host all all all scram-sha-256`, lets the superuser in from any address that reaches the port, with the password
# in compose.controlplane.yaml. Once CP_DB_BIND publishes the port on the private network (deploy/worker-vm), that
# address would include the worker VM, the machine most likely to be compromised, and the restricted role would be
# pointless. So: the containers on this compose network may use any role, and anything else only mergit_worker.
#
# The compose network is pinned to the subnet below (deploy/compose.controlplane.yaml, `networks.default.ipam`)
# and matched here by that exact CIDR, not `samenet`: `samenet` matches any address sharing a subnet with any of
# the server's interfaces, which under some Docker network settings (docker-proxy's own bridge gateway,
# `iptables: false`) is the address a published port sees a connection arrive from, superuser password and all.
# A fixed, narrow CIDR cannot widen that way. Keep the two in step if the subnet is ever changed.
local   all         all                             trust
host    all         all             127.0.0.1/32    trust
host    all         all             ::1/128         trust
host    all         all             172.30.9.0/24   scram-sha-256
host    mergit_cp   mergit_worker   all             scram-sha-256
