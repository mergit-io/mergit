# Who may log in to cp_postgres (deploy/compose.controlplane.yaml). It replaces the image's default, whose last line,
# `host all all all scram-sha-256`, lets the superuser in from any address that reaches the port. Once CP_DB_BIND
# publishes the port on the private network (deploy/worker-vm), that address would include the worker VM, the machine
# most likely to be compromised, and the restricted role would be pointless. So: the containers on this compose
# network may use any role, and anything else only mergit_worker.
#
# "The containers" is 172.30.53.128/25, the ip_range of the compose network (`networks:` at the end of
# compose.controlplane.yaml; tests/test_cp_postgres_hba.py checks the two agree). It is NOT `samenet`, and not the
# whole 172.30.53.0/24: both include the bridge gateway 172.30.53.1, the host's own address on the network. Docker
# usually keeps the source address of a connection to a published port, but not always: when docker-proxy (the
# userland proxy, on by default) carries it, with rootless Docker (its port driver), or with `"iptables": false` in
# daemon.json, the worker VM's connection reaches cp_postgres from the gateway, so a rule covering the gateway would
# let it log in as postgres. Nothing in this file depends on which of those the server uses.
local   all         all                                 trust
host    all         all             127.0.0.1/32        trust
host    all         all             ::1/128             trust
host    all         all             172.30.53.128/25    scram-sha-256
host    mergit_cp   mergit_worker   all                 scram-sha-256
