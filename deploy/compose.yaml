# The whole stack on one machine, against a local Anvil chain with mock USDC. Nothing touches a real network.
#   docker compose -f deploy/compose.yaml up --build
# Needs mergit-contracts checked out next to this repository (../mergit-contracts).
# The keys below are Anvil's public test keys (accounts 0, 2, 3, 4). Never use them anywhere real.

x-rust: &rust
  build: { context: .., dockerfile: deploy/docker/rust.Dockerfile }
  image: mergit-rust:local
  restart: unless-stopped
  environment: &chain
    RPC_URL: http://anvil:8545
    DEPLOYMENT_FILE: /deployments/local.json
    RUST_LOG: info
  volumes:
    - ../../mergit-contracts/deployments:/deployments:ro
  depends_on:
    deploy: { condition: service_completed_successfully }

services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: mergit, POSTGRES_DB: mergit }
    healthcheck: { test: ["CMD", "pg_isready", "-U", "postgres"], interval: 2s, retries: 30 }

  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    entrypoint: ["anvil", "--host", "0.0.0.0"]
    ports: ["8545:8545"]

  deploy:
    image: ghcr.io/foundry-rs/foundry:latest
    working_dir: /contracts
    volumes: ["../../mergit-contracts:/contracts"]
    depends_on: [anvil]
    environment:
      DEPLOYMENT_NAME: local
      GATEWAY_ADDR: "0x3C44CdDdB6a900fa2b585dd299e03d12FA4293BC"
      VALIDATOR_ADDR: "0x90F79bf6EB2c4f870365E785982E1f101E93b906"
      TREASURY_ADDR: "0x15d34AAf54267DB7D7c367839AAf71A00a2C6A65"
      ADJUDICATOR_ADDR: "0x15d34AAf54267DB7D7c367839AAf71A00a2C6A65"
    entrypoint:
      - sh
      - -c
      - forge script script/Deploy.s.sol --rpc-url http://anvil:8545 --broadcast
        --private-key 0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80

  store:
    <<: *rust
    command: ["mergit-store"]
    environment: { STORE_DATA_DIR: /data, STORE_ADDR: "0.0.0.0:8081", STORE_WRITE_TOKEN: local-store-token }
    ports: ["8081:8081"]
    depends_on: []

  validator:
    <<: *rust
    command: ["mergit-validator"]
    environment:
      <<: *chain
      VALIDATOR_KEY: "0x7c852118294e51e653712a81e05800f419141751be58f605c371e15141b007a6"
      STORE_URL: http://store:8081
      AUDIT_P: "1.0"
      VALIDATOR_DATA_DIR: /data
      VALIDATOR_ADDR: "0.0.0.0:8083"
      AUDIT_TOKEN: local-audit-token
    ports: ["8083:8083"]

  gateway:
    <<: *rust
    command: ["mergit-gateway"]
    environment:
      <<: *chain
      DATABASE_URL: postgres://postgres:mergit@postgres:5432/mergit
      GATEWAY_KEY: "0x5de4111afa1a4b94908f83103eb1f1706367c2e68ca870fc3fb9a804cdab365a"
      TREASURY_KEY: "0x47e179ec197488593b187f80a00eb0da91f1b9d0b13f8733639f19c30a34926a"
      ORCHESTRATOR_URL: http://api:8000
      VALIDATOR_URL: http://validator:8083
      CONFIRMATIONS: "0"
      GATEWAY_ADDR: "0.0.0.0:8082"
      EVENTS_TOKEN: local-events-token
      AUDIT_TOKEN: local-audit-token
      CHAIN_EVENTS_TOKEN: local-chain-events-token
    ports: ["8082:8082"]
    depends_on:
      deploy: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }

  # Control plane (plan task O10): its own Postgres (control-plane/README.md — it does not share the
  # gateway's database; both have tables named plans/tasks/outbox), the API and the agent worker.
  cp_postgres:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: mergit, POSTGRES_DB: mergit_cp }
    healthcheck: { test: ["CMD", "pg_isready", "-U", "postgres"], interval: 2s, retries: 30 }

  api:
    build: { context: .., dockerfile: control-plane/Dockerfile }
    image: mergit-api:local
    restart: unless-stopped
    ports: ["8000:8000"]
    depends_on:
      cp_postgres: { condition: service_healthy }
      deploy: { condition: service_completed_successfully }
    environment:
      DATABASE_URL: postgres://postgres:mergit@cp_postgres:5432/mergit_cp
      APP_DOMAIN: localhost
      SESSION_SECRET: local-session-secret-dev-only-do-not-use-for-anything-real
      GATEWAY_URL: http://gateway:8082
      STORE_URL: http://store:8081
      AGENTS_FILE: /app/deploy/agents.local.json
      PLANNER_MODEL: claude-haiku-4-5
      PLANNER_PROVIDER: anthropic
      EVENTS_TOKEN: local-events-token
      CHAIN_EVENTS_TOKEN: local-chain-events-token
      WORKER_TOKEN: local-worker-progress-token
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY before starting the planner}
      # Optional: the api service itself doesn't need it to serve normal traffic, only `python -m
      # mergit_cp.llm_check` does (control-plane/README.md), run by hand inside this container to check
      # every provider in use, including an agent's openrouter one.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}

  worker:
    build: { context: .., dockerfile: control-plane/worker.Dockerfile }
    image: mergit-worker:local
    restart: unless-stopped
    depends_on:
      cp_postgres: { condition: service_healthy }
      deploy: { condition: service_completed_successfully }
      api: { condition: service_started }
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Must be the identical path on the host and in this container: sandboxes are started through
      # the host Docker socket, which resolves this bind source itself (control-plane/README.md).
      - /var/lib/mergit/workspaces:/var/lib/mergit/workspaces
      - ../../mergit-contracts/deployments:/deployments:ro
    environment:
      DATABASE_URL: postgres://postgres:mergit@cp_postgres:5432/mergit_cp
      GATEWAY_URL: http://gateway:8082
      STORE_URL: http://store:8081
      EVENTS_TOKEN: local-events-token
      STORE_WRITE_TOKEN: local-store-token
      DEPLOYMENT_FILE: /deployments/local.json
      AGENTS_FILE: /app/deploy/agents.local.json
      CONTROL_PLANE_URL: http://api:8000
      WORKER_TOKEN: local-worker-progress-token
      SANDBOX_IMAGE: mergit-sandbox:dev
      SANDBOX_WORKSPACE_ROOT: /var/lib/mergit/workspaces
      # Freshly generated for this local stack (never used anywhere real), matching the runtime_key
      # addresses in deploy/agents.local.json. Not the shared-example deploy/agents.example.json.
      MERGIT_AGENT_KEY_1: "0x5d494b945348034ee48abb4651b80cc519f857de563b0df0fbe7cc1b2c28389a"
      MERGIT_AGENT_KEY_2: "0xcb78d92ca5e24d6c4bbe912b25ee362c982f591ecba1afcac7f3b18feb3165d7"
      # claude-worker and second-worker (deploy/agents.local.json) are both provider = "openrouter" in
      # agents.toml now; ANTHROPIC_API_KEY is not read, since ModelClients.build only builds a client for
      # a provider a *deployed* agent actually names (mergit_worker/agents.py validate_agents_have_keys).
      # mergit-coder-0 stays on Anthropic but is not deployed in this local stack.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?set OPENROUTER_API_KEY before starting the worker}
