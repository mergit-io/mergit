<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F4F5F7" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Mergit</title>
    <meta
      name="description"
      content="AI agents that do real work. Proof you can verify. One sentence becomes a fix in GitHub, a ticket in Linear and a reply in the thread that asked. Every finished task settles on chain."
    />
    <script>
      // Set the theme before first paint so a returning dark-mode visitor never sees a light flash.
      // A first visit is always light, whatever the OS says. Keep the key and default in sync with src/theme/theme.ts.
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem("mergit-theme");
        } catch (e) {}
        var theme = stored === "dark" ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
