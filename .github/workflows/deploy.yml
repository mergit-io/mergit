name: deploy

# Redeploys the Hetzner server (deploy/server/README.md) by running deploy/server/update.sh over SSH.
#
# It runs after the CI workflows finish on main, and only deploys when every CI run for that commit passed:
#   - control-plane, frontend and rust only run for pushes that touch their paths, so a push may trigger any of them or none;
#     deploy waits for whichever ran. A push that triggers none (docs only, say) does not deploy.
#   - if another CI run for the same commit is still going, this run steps aside; that run's own finish starts deploy again.
#   - it only deploys if the commit is still the tip of main, because update.sh pulls main and would otherwise ship a newer,
#     untested commit. That newer commit's own CI starts its own deploy.
#   - a manual run (Actions tab, "Run workflow") skips the checks, for a redeploy you decided on yourself.
#
# Repository secrets:
#   DEPLOY_HOST        server hostname or IPv4
#   DEPLOY_USER        login user on the server
#   DEPLOY_SSH_KEY     private key of a key made only for this (see the README, "Automatic deploys")
#   DEPLOY_KNOWN_HOSTS output of `ssh-keyscan -t ed25519 <host>`, so the host key is pinned and not trusted on first use

on:
  workflow_run:
    workflows: [control-plane, frontend, rust]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      what:
        description: "What to update"
        type: choice
        options: [all, services, web, app]
        default: all

permissions:
  contents: read
  actions: read

# Never cancel a deploy half-way through a build; the next one waits its turn.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Never deploy from a failed CI run, a pull request, or another branch.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    steps:
      - name: Check every CI run for this commit passed
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          skip() { echo "::notice::$1"; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0; }
          if [ "$EVENT" = workflow_dispatch ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi

          tip=$(gh api "repos/$REPO/commits/main" --jq .sha)
          [ "$tip" = "$SHA" ] || skip "$SHA is not the tip of main any more ($tip); the newer commit deploys itself."

          runs=$(gh run list --repo "$REPO" --commit "$SHA" --event push --limit 100 --json name,status,conclusion)
          pending=$(jq '[.[] | select(.name != "deploy" and .status != "completed")] | length' <<<"$runs")
          [ "$pending" = 0 ] || skip "$pending CI run(s) for $SHA are still going; deploy starts again when they finish."
          bad=$(jq -r '[.[] | select(.name != "deploy" and (.conclusion | IN("success","skipped","neutral") | not)) | .name] | join(", ")' <<<"$runs")
          [ -z "$bad" ] || skip "Not deploying $SHA: CI did not pass ($bad)."

          # Several CI workflows finishing together each start a deploy; the first one wins, and a retry after a failed one
          # still runs. "Won" means that run's update.sh step succeeded or is still running. A run that stepped aside above
          # also ends as a success, and must not count: it deployed nothing.
          done_already=0
          for id in $(gh run list --repo "$REPO" --workflow deploy --commit "$SHA" --limit 100 --json databaseId \
                        --jq ".[] | select(.databaseId < $GITHUB_RUN_ID) | .databaseId"); do
            step=$(gh api "repos/$REPO/actions/runs/$id/jobs" \
              --jq '[.jobs[].steps[] | select(.name == "Run update.sh on the server") | (.conclusion // .status)] | first // "none"')
            case "$step" in success|in_progress|queued|pending) done_already=1 ;; esac
          done
          [ "$done_already" = 0 ] || skip "$SHA is already deployed or being deployed."

          echo "go=true" >> "$GITHUB_OUTPUT"

      - name: Check the deploy secrets are set
        if: steps.gate.outputs.go == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          missing=0
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then echo "::error::Repository secret $name is not set (deploy/server/README.md, Automatic deploys)"; missing=1; fi
          done
          exit $missing
      - name: Install the key and the pinned host key
        if: steps.gate.outputs.go == 'true'
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Run update.sh on the server
        if: steps.gate.outputs.go == 'true'
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          WHAT: ${{ inputs.what || 'all' }}
        run: ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 "$TARGET" "$WHAT"
