[package]
name = "mergit-receipt"
edition.workspace = true
license.workspace = true
version.workspace = true
rust-version.workspace = true

[dependencies]
mergit-spec.workspace = true
alloy-primitives.workspace = true
alloy-sol-types.workspace = true
alloy-signer.workspace = true
alloy-signer-local.workspace = true
serde_json.workspace = true
chrono.workspace = true
base64.workspace = true
thiserror.workspace = true
# Optional: only the test-attestation feature (tests, gen_vectors) pulls it in. No release package enables it.
mergit-verifier = { workspace = true, optional = true }

[features]
# Builds forged receipts for guard tests and test vectors. No service, binding or image enables it.
forgery-fixture = []
# Issues test-kind attestation documents. Test-only: no service, binding or image enables it.
test-attestation = ["dep:mergit-verifier", "mergit-verifier/test-attestation"]

[dev-dependencies]
serde_json.workspace = true

[[example]]
name = "gen_vectors"
required-features = ["forgery-fixture", "test-attestation"]

[[example]]
name = "false_receipt"
required-features = ["forgery-fixture"]
